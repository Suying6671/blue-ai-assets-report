<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>从个人经验到组织资产 | Cobalt Grid Slides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400..500&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===========================================
       THEME: COBALT GRID
       Warm cream paper, electric cobalt ink, fixed editorial grid.
       =========================================== */
    :root {
      --paper: #F0EBDE;
      --paper-2: #E6E0CE;
      --ink: #1F2BE0;
      --ink-soft: #5560E5;
      --grid: rgba(31, 43, 224, 0.10);
      --ink-faint: rgba(31, 43, 224, 0.18);
      --stage-bg: #D7D1C0;
      --slide-bg: var(--paper);
      --font-display: "Newsreader", "Noto Serif SC", Georgia, serif;
      --font-body: "Hanken Grotesk", "Noto Serif SC", sans-serif;
      --font-mono: "DM Mono", ui-monospace, monospace;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --duration-normal: 620ms;
    }

    * { box-sizing: border-box; }

    /* ===========================================
       FIXED 16:9 STAGE: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       Slides are authored at 1920×1080 and scaled as a whole.
       =========================================== */

    /* 1. Lock the browser viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 2. Full-window deck viewport */
    .deck-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 3. Fixed 16:9 design canvas.
       JavaScript sets transform: translate(...) scale(...). */
    .deck-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--slide-bg, #fff);
    }

    /* 4. Slides stack inside the fixed stage.
       Content must be laid out at 1920×1080, not reflowed per device. */
    .slide {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: block;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: var(--slide-bg, #fff);
    }

    .slide.active,
    .slide.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        z-index: 1;
    }

    /* 5. Keep media inside authored slide bounds */
    img,
    video,
    canvas,
    svg {
        max-width: 100%;
        max-height: 100%;
    }

    /* 6. Presentation chrome stays outside the slide design system */
    .deck-controls {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 1000;
    }

    /* 7. Print one fixed-size slide per page */
    @media print {
        html,
        body {
            width: 1920px;
            height: auto;
            overflow: visible;
            background: #fff;
        }

        .deck-viewport {
            position: static;
            overflow: visible;
            background: #fff;
        }

        .deck-stage {
            position: static;
            width: auto;
            height: auto;
            transform: none !important;
            background: none;
        }

        .slide {
            position: relative;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: 1920px;
            height: 1080px;
            break-after: page;
            page-break-after: always;
        }

        .slide:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .deck-controls {
            display: none !important;
        }
    }

    /* 8. Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.2s !important;
        }
    }

    /* ===========================================
       COBALT GRID CANVAS AND CHROME
       Permanent graph-paper grid, hairlines, page number, catalogue tag.
       =========================================== */
    body {
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .deck-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .slide {
      transition: opacity 280ms ease;
      color: var(--ink);
      isolation: isolate;
    }

    .slide > * {
      position: relative;
      z-index: 2;
    }

    .hairlines::before,
    .hairlines::after {
      content: "";
      position: absolute;
      left: 80px;
      right: 80px;
      height: 1.5px;
      background: var(--ink);
      z-index: 4;
      pointer-events: none;
    }

    .hairlines::before { top: 28px; }
    .hairlines::after { bottom: 24px; }

    .pagenum,
    .nav-hint {
      position: absolute;
      bottom: 58px;
      z-index: 5;
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.06em;
      color: var(--ink);
    }

    .pagenum { right: 80px; }
    .nav-hint { left: 80px; opacity: 0.42; }

    .frame {
      position: absolute;
      inset: 120px 80px 138px;
      z-index: 2;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
      padding-bottom: 22px;
      border-bottom: 1.5px solid var(--ink);
    }

    .topbar h2 {
      margin: 0;
      max-width: 1160px;
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: 0;
      color: var(--ink);
    }

    .lab-tag,
    .kicker,
    .micro {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
      color: var(--ink);
    }

    .latin,
    .mono,
    .slide-code {
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
    }

    .lab-tag {
      max-width: 330px;
      text-align: right;
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.05em;
      line-height: 1.45;
    }

    .kicker {
      margin: 0 0 28px;
      font-size: 18px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    /* ===========================================
       TYPOGRAPHY AND ANIMATION
       CJK headlines use Noto Serif SC at strong weights; Latin chrome stays mono.
       =========================================== */
    .title-display {
      font-family: var(--font-display);
      font-size: 142px;
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: 0;
      color: var(--ink);
    }

    .chapter-title {
      font-family: var(--font-display);
      font-size: 112px;
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: 0;
    }

    .statement {
      font-family: var(--font-display);
      font-size: 92px;
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: 0;
      color: var(--ink);
    }

    .body-lg {
      font-family: var(--font-body);
      font-size: 30px;
      line-height: 1.62;
      font-weight: 400;
      color: var(--ink);
    }

    .body-md {
      font-size: 25px;
      line-height: 1.62;
    }

    .body-sm {
      font-size: 21px;
      line-height: 1.55;
    }

    .reveal,
    .reveal-left,
    .reveal-blur {
      opacity: 0;
      transition:
        opacity var(--duration-normal) var(--ease-out-expo),
        transform var(--duration-normal) var(--ease-out-expo),
        filter var(--duration-normal) var(--ease-out-expo);
    }

    .reveal { transform: translateY(34px); }
    .reveal-left { transform: translateX(-46px); }
    .reveal-blur { filter: blur(10px); transform: translateY(12px); }

    .slide.visible .reveal,
    .slide.visible .reveal-left,
    .slide.visible .reveal-blur {
      opacity: 1;
      transform: translate(0, 0);
      filter: blur(0);
    }

    .slide.visible .delay-1 { transition-delay: 90ms; }
    .slide.visible .delay-2 { transition-delay: 180ms; }
    .slide.visible .delay-3 { transition-delay: 270ms; }
    .slide.visible .delay-4 { transition-delay: 360ms; }
    .slide.visible .delay-5 { transition-delay: 450ms; }

    /* ===========================================
       DECORATIVE COBALT GRID ELEMENTS
       Pixel glitch scanlines and QR-style 8×8 patches.
       =========================================== */
    .pixel-glitch {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 430px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.72;
    }

    .pixel-glitch.left {
      left: 0;
      right: auto;
      transform: scaleX(-1);
    }

    .pixel-glitch span {
      position: absolute;
      right: 0;
      height: 116px;
      background:
        repeating-linear-gradient(
          90deg,
          var(--ink) 0 2px,
          transparent 2px 11px
        );
    }

    .pixel-glitch span:nth-child(1) { top: 66px; width: 420px; }
    .pixel-glitch span:nth-child(2) { top: 188px; width: 346px; }
    .pixel-glitch span:nth-child(3) { top: 310px; width: 286px; }
    .pixel-glitch span:nth-child(4) { top: 432px; width: 228px; }
    .pixel-glitch span:nth-child(5) { top: 554px; width: 318px; }
    .pixel-glitch span:nth-child(6) { top: 676px; width: 236px; }
    .pixel-glitch span:nth-child(7) { top: 798px; width: 180px; }

    .qr-block {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 2px;
      width: 92px;
      height: 92px;
      padding: 5px;
      background: var(--paper);
      box-shadow: 0 0 0 1.5px var(--paper);
      z-index: 5;
    }

    .qr-block i {
      display: block;
      background: transparent;
    }

    .qr-block i.on { background: var(--ink); }

    .vertical-label {
      position: absolute;
      right: 28px;
      top: 210px;
      height: 660px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--ink);
      z-index: 3;
    }

    /* ===========================================
       SLIDE LAYOUT SYSTEMS
       Cover, index lists, comparison tables, loops, ledgers, roadmap.
       =========================================== */
    .cover-copy {
      position: absolute;
      left: 120px;
      top: 150px;
      width: 1200px;
      z-index: 4;
    }

    .cover-copy .title-display {
      max-width: 980px;
      margin-bottom: 36px;
    }

    .cover-subtitle {
      width: 720px;
      padding-top: 22px;
      border-top: 1.5px solid var(--ink);
      font-size: 33px;
      line-height: 1.48;
    }

    .cover-meta {
      position: absolute;
      left: 120px;
      bottom: 134px;
      display: grid;
      grid-template-columns: 220px 350px 320px;
      gap: 32px;
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.05em;
      line-height: 1.45;
      z-index: 4;
    }

    .chapter-center {
      position: absolute;
      left: 170px;
      top: 220px;
      width: 1040px;
      z-index: 4;
    }

    .chapter-center .body-lg {
      width: 760px;
      margin-top: 34px;
      padding-top: 24px;
      border-top: 1.5px solid var(--ink);
    }

    .index-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 54px;
      row-gap: 0;
      margin-top: 34px;
    }

    .index-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 24px;
      min-height: 122px;
      padding: 22px 0;
      border-bottom: 1px solid var(--ink-faint);
    }

    .index-row .num {
      font-family: var(--font-mono);
      font-size: 20px;
      letter-spacing: 0.05em;
    }

    .index-row h3 {
      margin-bottom: 8px;
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 700;
      line-height: 1.12;
    }

    .index-row p {
      font-size: 22px;
      line-height: 1.52;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      margin-top: 42px;
      height: 610px;
    }

    .compare-panel {
      border-top: 1.5px solid var(--ink);
      border-bottom: 1px solid var(--ink-faint);
      padding: 30px 0 20px;
    }

    .compare-panel h3 {
      font-family: var(--font-display);
      font-size: 58px;
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .compare-panel ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 16px;
      font-size: 26px;
      line-height: 1.45;
    }

    .compare-panel li {
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink-faint);
    }

    .manifesto {
      position: absolute;
      left: 180px;
      right: 180px;
      top: 220px;
      z-index: 4;
    }

    .manifesto .statement {
      max-width: 1260px;
    }

    .manifesto-footer {
      display: grid;
      grid-template-columns: 1fr 0.8fr;
      gap: 48px;
      margin-top: 54px;
      padding-top: 24px;
      border-top: 1px solid var(--ink);
      font-size: 25px;
      line-height: 1.58;
    }

    .loop {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
      margin-top: 54px;
    }

    .loop-step {
      min-height: 220px;
      padding: 22px 18px;
      border-top: 1.5px solid var(--ink);
      border-bottom: 1px solid var(--ink-faint);
    }

    .loop-step .mono {
      display: block;
      margin-bottom: 24px;
      font-size: 16px;
    }

    .loop-step h3 {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 12px;
    }

    .loop-step p {
      font-size: 20px;
      line-height: 1.48;
    }

    .account {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 44px;
      margin-top: 38px;
      align-items: start;
    }

    .account-card {
      border-top: 1.5px solid var(--ink);
      padding-top: 26px;
    }

    .account-name {
      font-family: var(--font-display);
      font-size: 58px;
      line-height: 1;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 28px;
    }

    .stat {
      padding: 22px 0;
      border-bottom: 1px solid var(--ink-faint);
    }

    .stat b {
      display: block;
      font-family: var(--font-display);
      font-size: 66px;
      line-height: 0.96;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat span {
      font-size: 19px;
      line-height: 1.35;
    }

    .mini-table {
      display: grid;
      border-top: 1.5px solid var(--ink);
      margin-top: 3px;
    }

    .mini-row {
      display: grid;
      grid-template-columns: 0.55fr 1.45fr;
      gap: 24px;
      padding: 19px 0;
      border-bottom: 1px solid var(--ink-faint);
      font-size: 22px;
      line-height: 1.45;
    }

    .mini-row strong {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.05;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      margin-top: 48px;
      align-items: stretch;
    }

    .flow-card {
      min-height: 235px;
      padding: 23px 18px 20px;
      border-top: 1.5px solid var(--ink);
      border-bottom: 1px solid var(--ink-faint);
    }

    .flow-card h3 {
      font-family: var(--font-display);
      font-size: 35px;
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 14px;
    }

    .flow-card p {
      font-size: 20px;
      line-height: 1.48;
    }

    .arrow {
      align-self: center;
      text-align: center;
      font-family: var(--font-display);
      font-size: 60px;
      line-height: 1;
    }

    .table {
      margin-top: 34px;
      border-top: 1.5px solid var(--ink);
    }

    .table-row {
      display: grid;
      grid-template-columns: 0.7fr 1.4fr 1.4fr;
      gap: 30px;
      padding: 18px 0;
      border-bottom: 1px solid var(--ink-faint);
      font-size: 21px;
      line-height: 1.46;
    }

    .table-row.head {
      font-family: var(--font-mono);
      font-size: 15px;
      letter-spacing: 0.05em;
      border-bottom: 1.5px solid var(--ink);
    }

    .table-row strong {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .roadmap {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
      margin-top: 36px;
    }

    .month {
      min-height: 545px;
      border-top: 1.5px solid var(--ink);
      padding-top: 20px;
    }

    .month .mono {
      display: block;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .month ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 16px;
      font-size: 20px;
      line-height: 1.38;
    }

    .month li {
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink-faint);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0 34px;
      margin-top: 34px;
    }

    .metric {
      min-height: 154px;
      padding: 20px 0 18px;
      border-top: 1.5px solid var(--ink);
      border-bottom: 1px solid var(--ink-faint);
    }

    .metric b {
      display: block;
      font-family: var(--font-display);
      font-size: 54px;
      line-height: 1;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .metric p {
      font-size: 21px;
      line-height: 1.42;
    }

    .decision {
      position: absolute;
      left: 180px;
      right: 180px;
      top: 190px;
      z-index: 4;
      text-align: right;
    }

    .decision .statement {
      margin-left: auto;
      max-width: 1320px;
      font-size: 100px;
    }

    .decision-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 34px;
      margin-top: 50px;
      text-align: left;
      border-top: 1.5px solid var(--ink);
    }

    .decision-grid div {
      padding-top: 22px;
      font-size: 24px;
      line-height: 1.48;
    }

    /* ===========================================
       PIXEL STACK CHART
       Data shown as on/off cobalt cells, echoing the glitch system.
       =========================================== */
    .chart-wrap {
      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      gap: 54px;
      margin-top: 42px;
      align-items: end;
    }

    .pixel-chart {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
      height: 420px;
      align-items: end;
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 14px;
    }

    .stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 5px;
      height: 360px;
      justify-content: flex-start;
    }

    .stack i {
      display: block;
      height: 19px;
      background: var(--grid);
    }

    .stack i.on { background: var(--ink); }

    .chart-labels {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
      margin-top: 18px;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.03em;
      line-height: 1.25;
    }

    .chart-copy {
      border-top: 1.5px solid var(--ink);
      padding-top: 24px;
    }

    .chart-copy h3 {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 700;
      line-height: 1.02;
      margin-bottom: 22px;
    }

    /* ===========================================
       EDITING AND PRESENTATION CONTROLS
       Hidden by default; keyboard E toggles edit mode.
       =========================================== */
    .deck-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--paper);
      background: rgba(31, 43, 224, 0.92);
      padding: 8px 12px;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .deck-controls:hover,
    .deck-controls:focus-within {
      opacity: 1;
    }

    .deck-controls button,
    .edit-toggle {
      border: 1px solid var(--paper);
      background: transparent;
      color: var(--paper);
      font: inherit;
      padding: 5px 8px;
      cursor: pointer;
    }

    .edit-hotzone {
      position: fixed;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      z-index: 10000;
    }

    .edit-toggle {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10001;
      opacity: 0;
      pointer-events: none;

              <div class="pixel-chart">
                ${slide.values.map(value => `
                  <div class="stack">${Array.from({ length: 10 }, (_, i) => `<i class="${i < value ? "on" : ""}"></i>`).join("")}</div>
                `).join("")}
              </div>
              <div class="chart-labels">${slide.labels.map((l, i) => `<div data-editable="${contentKey}-label-${i}">${l}</div>`).join("")}</div>
            </div>
          </div>
        </div></section>`;
      }

      if (slide.type === "roadmap") {
        return `<section class="slide" data-slide="${index}">
          ${frameTop(slide, index)}
          <div class="roadmap">
            ${slide.months.map((month, i) => `
              <div class="month reveal delay-${Math.min(i, 5)}">
                <span class="mono">${month[0]}</span>
                <ul>${month[1].map((x, j) => `<li data-editable="${contentKey}-m${i}-${j}">${x}</li>`).join("")}</ul>
              </div>
            `).join("")}
          </div>
        </div></section>`;
      }

      if (slide.type === "metrics") {
        return `<section class="slide" data-slide="${index}">
          ${frameTop(slide, index)}
          <div class="metrics">
            ${slide.metrics.map((metric, i) => `
              <div class="metric reveal delay-${Math.min(i, 5)}">
                <b data-editable="${contentKey}-metric-num-${i}">${metric[0]}</b>
                <p data-editable="${contentKey}-metric-copy-${i}">${metric[1]}</p>
              </div>
            `).join("")}
          </div>
        </div></section>`;
      }

      if (slide.type === "decision") {
        return `<section class="slide" data-slide="${index}">
          ${chrome(index)}${glitch("left")}
          <div style="position:absolute;left:312px;top:126px">${qr()}</div>
          <div class="decision">
            <p class="kicker reveal-left">FINAL ASK</p>
            <h2 class="statement reveal-blur delay-1" data-editable="${contentKey}-statement">${slide.statement}</h2>
            <div class="decision-grid reveal delay-2">
              ${slide.items.map((x, i) => `<div data-editable="${contentKey}-decision-${i}">${x}</div>`).join("")}
            </div>
          </div>
        </section>`;
      }
    }

    /* ===========================================
       SLIDE CONTROLLER
       Keyboard, touch, wheel, scaling, hash routing.
       =========================================== */
    class SlidePresentation {
      constructor() {
        this.currentSlide = 0;
        this.stage = deckStage;
        this.render();
        this.slides = document.querySelectorAll(".slide");
        this.counter = document.getElementById("counter");
        this.setupStageScale();
        this.setupNavigation();
        this.setupEditor();
        const fromHash = Number(location.hash.replace("#", "")) - 1;
        this.showSlide(Number.isFinite(fromHash) && fromHash >= 0 ? fromHash : 0);
      }

      render() {
        this.stage.innerHTML = slides.map(renderSlide).join("");
        this.applySavedEdits();
      }

      setupStageScale() {
        const scale = () => {
          const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
          const x = (window.innerWidth - 1920 * factor) / 2;
          const y = (window.innerHeight - 1080 * factor) / 2;
          this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener("resize", scale);
      }

      setupNavigation() {
        document.getElementById("prevBtn").addEventListener("click", () => this.prev());
        document.getElementById("nextBtn").addEventListener("click", () => this.next());
        window.addEventListener("hashchange", () => {
          const fromHash = Number(location.hash.replace("#", "")) - 1;
          if (Number.isFinite(fromHash) && fromHash >= 0 && fromHash < this.slides.length && fromHash !== this.currentSlide) {
            this.showSlide(fromHash, false);
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.target?.getAttribute("contenteditable") === "true") return;
          if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(event.key)) {
            event.preventDefault();
            this.next();
          }
          if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(event.key)) {
            event.preventDefault();
            this.prev();
          }
        });

        let wheelLock = false;
        document.addEventListener("wheel", (event) => {
          if (wheelLock) return;
          wheelLock = true;
          if (event.deltaY > 0) this.next();
          if (event.deltaY < 0) this.prev();
          window.setTimeout(() => { wheelLock = false; }, 520);
        }, { passive: true });

        let touchStartX = 0;
        let touchStartY = 0;
        document.addEventListener("touchstart", (event) => {
          touchStartX = event.changedTouches[0].screenX;
          touchStartY = event.changedTouches[0].screenY;
        }, { passive: true });
        document.addEventListener("touchend", (event) => {
          const dx = event.changedTouches[0].screenX - touchStartX;
          const dy = event.changedTouches[0].screenY - touchStartY;
          if (Math.abs(dx) > 45 || Math.abs(dy) > 45) {
            dx + dy < 0 ? this.next() : this.prev();
          }
        }, { passive: true });
      }

      showSlide(index, updateHash = true) {
        this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === this.currentSlide);
          slide.classList.toggle("visible", i === this.currentSlide);
        });
        this.counter.textContent = `${String(this.currentSlide + 1).padStart(2, "0")} / ${String(this.slides.length).padStart(2, "0")}`;
        if (updateHash) history.replaceState(null, "", `#${this.currentSlide + 1}`);
      }

      next() { this.showSlide(this.currentSlide + 1); }
      prev() { this.showSlide(this.currentSlide - 1); }

      setupEditor() {
        const editToggle = document.getElementById("editToggle");
        const hotzone = document.querySelector(".edit-hotzone");
        let hideTimeout = null;
        const reveal = () => {
          clearTimeout(hideTimeout);
          editToggle.classList.add("show");
        };
        const hide = () => {
          hideTimeout = setTimeout(() => {
            if (!document.body.classList.contains("editing")) editToggle.classList.remove("show");
          }, 400);
        };

        hotzone.addEventListener("mouseenter", reveal);
        hotzone.addEventListener("mouseleave", hide);
        hotzone.addEventListener("click", () => this.toggleEditMode());
        editToggle.addEventListener("mouseenter", reveal);
        editToggle.addEventListener("mouseleave", hide);
        editToggle.addEventListener("click", () => this.toggleEditMode());
        document.addEventListener("keydown", (event) => {
          if ((event.key === "e" || event.key === "E") && event.target?.getAttribute("contenteditable") !== "true") {
            this.toggleEditMode();
          }
        });
        document.addEventListener("input", (event) => {
          const key = event.target?.dataset?.editable;
          if (key) localStorage.setItem(`cobalt-grid:${key}`, event.target.innerHTML);
        });
      }

      toggleEditMode() {
        const editing = document.body.classList.toggle("editing");
        document.getElementById("editToggle").classList.toggle("active", editing);
        document.querySelectorAll("[data-editable]").forEach((node) => {
          node.setAttribute("contenteditable", editing ? "true" : "false");
        });
      }

      applySavedEdits() {
        document.querySelectorAll("[data-editable]").forEach((node) => {
          const saved = localStorage.getItem(`cobalt-grid:${node.dataset.editable}`);
          if (saved) node.innerHTML = saved;
        });
      }
    }

    new SlidePresentation();
  </script>
</body>
